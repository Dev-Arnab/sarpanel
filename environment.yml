# Reproducible environment for sarpanel.
#
# Install this with conda. Do not start from `pip install sarpanel`.
# rasterio and geopandas need GDAL's osgeo bindings, which pip does not
# provide. pyroSAR depends on psycopg2, and a pip install compiles that from
# source, which fails with "pg_config executable not found" unless PostgreSQL
# development headers are already installed. conda-forge ships both as binaries.
# The conda package for pyroSAR is named pyrosar.
#
# ESA SNAP is not a conda package either. Install it separately and set SNAP_HOME.
# See README.md.
#
# Create the environment with:
#     conda env create -f environment.yml
#     conda activate sarpanel
#     pip install --no-deps -e .
name: sarpanel
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - pyarrow
  - pyyaml
  - geopandas
  - shapely
  - pyproj
  - rasterio
  - jupyterlab
  - ipykernel
  - pytest
  - asf_search>=7
  - pyrosar>=0.24
