# Reproducible environment for sarpanel.
#
# The geospatial libraries (geopandas, rasterio) are installed from conda-forge
# because their GDAL bindings usually fail if you install them with pip alone.
# asf_search and pyroSAR are plain Python and are installed with pip afterwards.
#
# ESA SNAP is not a Python package. Install it separately and set SNAP_HOME.
# See README.md.
#
# Create the environment with:
#     conda env create -f environment.yml
#     conda activate sarpanel
#     pip install --no-deps -e .
name: sarpanel
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - pyarrow
  - pyyaml
  - geopandas
  - shapely
  - pyproj
  - rasterio
  - jupyterlab
  - ipykernel
  - pytest
  - pip
  - pip:
      - asf_search>=7
      - pyroSAR>=0.24
