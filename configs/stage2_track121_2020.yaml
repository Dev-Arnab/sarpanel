# Stage 2 of 3. Run after the smoke test passes and before the full archive.
#
# One track, one year: about 65 SLC scenes and 280 GB. The purpose is to get a
# real per-scene timing number on this cluster so the full array can be sized
# from measurement rather than estimate, and to surface any SNAP 12 against
# pyroSAR 0.31 operator mismatch on a run that costs hours instead of days.
#
#   sarpanel plan configs/stage2_track121_2020.yaml
#   sbatch --array=0-5 slurm/run_shard.sb configs/stage2_track121_2020.yaml
#   sarpanel status configs/stage2_track121_2020.yaml
#
#
# The direct replacement for step1_asf_to_farm.sb. Run tools/inspect_aoi.py
# against the geojson first: it will tell you which identifier column exists and
# whether the area filter finds what it expects.
#
#   python tools/inspect_aoi.py \
#     /mnt/research/bassolab/ysz_pipeline_rj/geopandas_data/combined_all_fields.geojson \
#     --search --start-date 2016-01-01 --end-date 2023-12-01
#
# Then:
#   sbatch slurm/plan.sb configs/michigan_all_fields.yaml
#   sbatch --array=0-399 slurm/run_shard.sb configs/michigan_all_fields.yaml

name: stage2_track121_2020

aoi:
  source: "/mnt/research/bassolab/ysz_pipeline_rj/geopandas_data/combined_all_fields.geojson"

  # Confirmed unique across all 328 features. 'Field' holds identical values;
  # farm_name is used because it is the more conventional name and matches the
  # identifier already in use elsewhere in the project.
  id_column: farm_name

  # 3 acres, the old pipeline's threshold. Computed in a projected CRS rather
  # than read from the 'acres' column, so it does not depend on how that column
  # was derived. It excludes exactly one of the 328 fields.
  min_area_m2: 12140

  # The AOI is compact: 328 fields clustered near Lansing, held by two farm
  # operations. The dissolved buffered union stays small enough for the catalog
  # to accept, so the WKT rejection risk that applies to statewide AOIs does not
  # arise here.
  search_buffer_m: 10000

search:
  start_date: "2020-01-01"
  end_date: "2020-12-31"
  beam_mode: IW
  polarization: "VV+VH"

  # Confirmed by catalog query over 2016-2023: exactly two tracks cover these
  # fields, both ascending. Track 48 contributes 313 scenes, track 121 gives
  # 379, for 692 total and about 2,983 GB of cumulative transfer.
  #
  # Both are kept deliberately. They view the fields at different incidence
  # angles, and that between-track contrast is the main source of geometry
  # variation available here, so dropping one would discard the signal this
  # pipeline exists to record.
  relative_orbits: [121]

  # Descending returns zero scenes over this AOI, verified with and without the
  # polarization filter, so this footprint is not in the descending acquisition
  # plan. Stated explicitly rather than left null so the run records that it was
  # checked rather than assumed.
  orbit_direction: ASCENDING

processing:
  product_type: SLC

  # The fields sit near 84.7 degrees west, just inside UTM zone 16N, so 32616
  # is the natural choice and matches the CRS the inspector used for areas.
  # EPSG:3078 (NAD83 Michigan Oblique Mercator) would also work and is the
  # better option if the AOI ever expands east past 84 degrees west, where a
  # single UTM zone starts to distort.
  target_crs: "EPSG:32616"
  target_spacing_m: 10.0

  polarizations: ["VV", "VH"]
  terrain_flattening: true          # gamma0 rather than sigma0
  dem: "Copernicus 30m Global DEM"
  remove_thermal_noise: true
  remove_border_noise: true

  # Off on purpose. A speckle filter destroys the ENL statistic that gives each
  # observation its precision weight.
  speckle_filter: null

  # Restrict processing to the part of the swath containing AOIs.
  # Terrain-Flattening was 77 percent of runtime in the smoke test and its cost
  # scales with processed area, not with how many polygons are wanted. The
  # buffer is generous because Terrain-Flattening needs surrounding terrain to
  # compute illuminated area near the edge; the extraction step masks to the
  # true polygons afterwards, so over-covering is safe and under-covering is
  # not.
  subset_to_aoi: true
  subset_buffer_m: 5000

  keep_archives: false

output:
  root: "/mnt/gs21/scratch/bassolab/sarpanel_stage2_2020"

  # Measured from the catalog: 692 scenes touching an average of 153 fields each
  # gives about 105,800 polygon-level observations, or roughly 219 million rows
  # at pixel granularity. Both are workable. Polygon first to validate, then
  # rerun with pixel for the within-field yield zone work.
  granularity: polygon

  # The smallest retained field holds about 600 pixels at 10 m, so this
  # threshold excludes nothing here. It stays in as a guard against scenes that
  # clip a field at the swath edge.
  min_valid_pixels: 16

  enl_trim_percentile: 2.0          # guards against farm buildings, open water
  drop_layover_shadow: true
  compression: zstd
  partition_by_date: true

# 692 scenes over 46 shards is 15 scenes each. At 45 to 90 minutes per SLC
# scene, that is 11 to 22 hours per shard, so slurm/run_shard.sb requests two
# days rather than one.
#
# Peak disk is set by concurrency, not by the 2,983 GB total: the runner deletes
# each archive after geocoding, so 46 tasks running at once hold roughly 340 GB
# between them. Check that figure against your scratch quota, not the total.
n_shards: 6
