[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarpanel"
version = "0.1.0"
description = "Analysis-ready Sentinel-1 observations over polygons, with acquisition geometry and speckle statistics retained"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dev Jyoti Ghosh Arnab" },
    { name = "Ryan Jayne" },
]
keywords = ["SAR", "Sentinel-1", "remote sensing", "agriculture", "pyroSAR", "ASF", "SNAP"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "asf-search>=7.0",
    "pyroSAR>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
sarpanel = "sarpanel.cli:main"

[project.urls]
Homepage = "https://github.com/Dev-Arnab/sarpanel"
Repository = "https://github.com/Dev-Arnab/sarpanel"
Issues = "https://github.com/Dev-Arnab/sarpanel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
# Pyflakes, pycodestyle, and import order. Newer ruff releases enable many
# extra rules by default; this selection keeps the check stable.
select = ["E", "F", "I"]
